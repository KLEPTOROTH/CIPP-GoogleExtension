name: gst64-playwright-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/gst64-playwright-gate.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  smoke-gate:
    name: GST-64 Chromium smoke gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @cipp-google/web build

      - name: Start web app
        run: |
          PORT=3100 pnpm --filter @cipp-google/web start > /tmp/gst64-web.log 2>&1 &
          echo $! > /tmp/gst64-web.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::web app did not become ready on 127.0.0.1:3100"
          cat /tmp/gst64-web.log || true
          exit 1

      - name: Run GST-64 smoke gate
        env:
          PLAYWRIGHT_NO_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: pnpm --filter @cipp-google/web test:e2e -- tests/e2e/smoke.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst64-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/gst64-web.log
          if-no-files-found: ignore

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/gst64-web.pid ]; then
            kill "$(cat /tmp/gst64-web.pid)" || true
          fi
