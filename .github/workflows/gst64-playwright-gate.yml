name: gst64-playwright-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'tools/test/**'
      - '.github/workflows/gst64-playwright-gate.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  smoke-gate:
    name: GST-64 Chromium smoke gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Run GST-64 smoke gate
        env:
          PLAYWRIGHT_NO_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: bash tools/test/run-gst64-playwright-gate.sh

      - name: Upload Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gst64-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/gst64-web.log
          if-no-files-found: ignore

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/gst64-web.pid ]; then
            kill "$(cat /tmp/gst64-web.pid)" || true
          fi
