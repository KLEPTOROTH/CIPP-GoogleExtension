name: gst64-playwright-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/gst64-playwright-gate.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  smoke-gate:
    name: GST-64 Chromium smoke gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm --filter @cipp-google/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @cipp-google/web build

      - name: Start web app
        run: |
          PORT=3100 pnpm --filter @cipp-google/web start > /tmp/gst64-web.log 2>&1 &
          echo $! > /tmp/gst64-web.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::web app did not become ready on 127.0.0.1:3100"
          cat /tmp/gst64-web.log || true
          exit 1

      - name: Run GST-64 smoke gate
        env:
          PLAYWRIGHT_NO_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: pnpm --filter @cipp-google/web test:e2e -- tests/e2e/smoke.spec.ts

      - name: Upload Playwright artifacts
        id: upload_artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gst64-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/gst64-web.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Emit Playwright artifact fallback
        if: always() && steps.upload_artifacts.outcome == 'failure'
        run: |
          evidence_paths=()
          [ -d apps/web/playwright-report ] && evidence_paths+=("apps/web/playwright-report")
          [ -d apps/web/test-results ] && evidence_paths+=("apps/web/test-results")
          [ -f /tmp/gst64-web.log ] && evidence_paths+=("/tmp/gst64-web.log")

          if [ "${#evidence_paths[@]}" -eq 0 ]; then
            echo "No GST-64 evidence paths were present for fallback capture."
            exit 0
          fi

          tar -czf /tmp/gst64-playwright-artifacts.tgz "${evidence_paths[@]}"
          {
            echo "## GST-64 Playwright artifact fallback"
            echo
            echo "Artifact upload failed, so this run emitted a base64 tarball in the job log."
            echo
            echo "Recover with:"
            echo
            echo '```bash'
            echo "sed -n '/^GST64_ARTIFACT_TGZ_BASE64_BEGIN$/,/^GST64_ARTIFACT_TGZ_BASE64_END$/p' job.log | sed '1d;\$d' | base64 -d > gst64-playwright-artifacts.tgz"
            echo "tar -xzf gst64-playwright-artifacts.tgz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "GST64_ARTIFACT_TGZ_BASE64_BEGIN"
          base64 /tmp/gst64-playwright-artifacts.tgz
          echo "GST64_ARTIFACT_TGZ_BASE64_END"

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/gst64-web.pid ]; then
            kill "$(cat /tmp/gst64-web.pid)" || true
          fi
